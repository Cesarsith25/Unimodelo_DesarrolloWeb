<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiquetas para maquetado</title>
</head>
<body>
  <!-- 
    Los elementos semánticos son aquellos que definen cual es el contenido que tendrán y le
    sirven a los navegadores web.

    Los elementos NO semánticos son los que no definen cual será el contenido que tienen dentro
  -->
  
  <div class="header">
    <div class="nav">
    </div>
  </div>

  <div class="main">
    <div class="articulo">
      <blockquote> Lorem ipsum dolor sit amet. </blockquote>
    </div>
  </div>

  <div class="sidebar"></div>
  <p>Lorem ipsum, dolor sit amet consectetur adipisicing.</p>
  <div class="footer"></div>

  <!--
    <div> Sirve de contenedor para cualquier elemento. NO tiene contenido semántico.
          Se le conoce también como contenedor universal.

    <header> Nos permite establecer el encabezado de nuestra página web.

    <nav> Nos permite definir un conjunto de enlaces de navegación.

    <section> Define una sección en un documento que puede contener un grupo de contenido.

    <article> Define un articulo.

    <aside> Nos permite definir un área con contenido independiente al principal, como el sidebar.

    <footer> Nos permite establecer el pie de página de un documento
    -->



</body>
</html>
