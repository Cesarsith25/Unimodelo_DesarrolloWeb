<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes Y Tablas</title>
</head>
<body>
  <img src="media/fondo.png" alt="fondo" title="fondo" style="width: 20%;">
  <!--
    "alt" es para en caso que no se encuentre la iamgen
    "title" es para cuando pones el mouse encima, suele ponerse lo mismo en ambos para cuestiones del SEO
  -->
  <br>
  <img src="media/fondo.png" alt="fondo" title="fondo" style="width: 20%;" loading="lazy">
  <br>
  <a href="https://www.ingenieria.eium.com.mx">
    <img src="media/fondo.png" alt="fondo" title="clase10sept" width="200">
  </a>

  <h2>Tablas</h2>
  <!-- tr = table row (fila), th = table header (encabezado), td = table data (celda) -->
  <table border="1">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Semestre</th>
        <th>Carrera</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Esteban</td>
        <td>5</td>
        <td>dts</td>
      </tr>
      <tr>
        <td>Esteban</td>
        <td>5</td>
        <td>dts</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
